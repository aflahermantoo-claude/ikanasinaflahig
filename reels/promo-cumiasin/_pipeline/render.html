<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#0B1220;}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0B1220;font-family:'Inter',sans-serif;color:#F9FAFB;}
#art{position:absolute;inset:0;}
.glass{position:absolute;background:rgba(255,255,255,0.10);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);border:2px solid rgba(255,255,255,0.28);border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,0.38), inset 0 2px 0 rgba(255,255,255,0.30);}
.light{background:rgba(255,255,255,0.90);color:#111827;border-color:rgba(255,255,255,0.95);}
.cap{left:70px;width:890px;box-sizing:border-box;padding:30px 40px;font-weight:600;font-size:64px;line-height:1.2;letter-spacing:-0.01em;text-align:center;}
.w{display:inline;transition:none;}
.hl{background:#E2B65C;color:#0B1220;border-radius:14px;padding:0 12px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.pill{left:50%;transform:translateX(-50%);top:290px;padding:14px 34px;font-size:40px;font-weight:500;color:#C7D2FE;border-radius:999px;white-space:nowrap;}
</style></head>
<body><div id="stage"><svg id="art" viewBox="0 0 1080 1920" width="1080" height="1920"></svg><div id="ui"></div></div>
<script>
const TL = window.TL || {};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const INK='#1F2937', NAVY='#1E3A8A', BLUE='#3B6FE0', GOLD='#E2B65C', ORANGE='#EF9F27', BG='#0B1220';

const DEFS=`<defs>
<radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2B59E8" stop-opacity="0.55"/><stop offset="1" stop-color="#2B59E8" stop-opacity="0"/></radialGradient>
<radialGradient id="gG" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E2B65C" stop-opacity="0.55"/><stop offset="1" stop-color="#E2B65C" stop-opacity="0"/></radialGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A3424"/><stop offset="1" stop-color="#1E1610"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121B30"/><stop offset="1" stop-color="#070B14"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13244A"/><stop offset="1" stop-color="#060A14"/></linearGradient>
</defs>`;

function glow(x,y,r,id='gB',op=1){return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id})" opacity="${op}"/>`;}
function bg(t,extra=''){return `<rect width="1080" height="1920" fill="${BG}"/>`+glow(540,520,760,'gB',1)+glow(900,1300,520,'gB',0.5)+extra;}

function lights(y,on=1){let s=`<path d="M-20 ${y} Q270 ${y+70} 540 ${y} T1100 ${y}" stroke="#334155" stroke-width="4" fill="none"/>`;
 for(let i=0;i<12;i++){const x=-10+i*100;const yy=y+Math.sin((x+20)/1120*Math.PI*2)*-35+ (i%2?18:10);
  s+= (on>0?glow(x,yy,46,'gG',on):'')+`<circle cx="${x}" cy="${yy}" r="11" fill="${on>0?'#F5D48A':'#3A4252'}"/>`;}
 return s;}
function awning(y){let s=`<rect x="0" y="${y}" width="1080" height="70" fill="${NAVY}"/>`;
 for(let i=0;i<9;i++){s+=`<rect x="${i*120}" y="${y}" width="60" height="70" fill="${BLUE}"/>`;}
 for(let i=0;i<18;i++){const x=i*60;s+=`<path d="M${x} ${y+70} q30 34 60 0 z" fill="${i%2?NAVY:BLUE}"/>`;}
 return s;}
function shelf(x,y,w,empty){let s=`<rect x="${x}" y="${y}" width="${w}" height="12" rx="4" fill="#2A3550"/><rect x="${x}" y="${y+150}" width="${w}" height="12" rx="4" fill="#2A3550"/>`;
 if(!empty){for(let i=0;i<Math.floor(w/70);i++){s+=`<rect x="${x+10+i*70}" y="${y-70}" width="50" height="70" rx="10" fill="#2F4A7A"/><rect x="${x+16+i*70}" y="${y-44}" width="38" height="18" rx="4" fill="${GOLD}" opacity="0.8"/>`;
   s+=`<rect x="${x+10+i*70}" y="${y+80}" width="50" height="70" rx="10" fill="#26406B"/>`;}}
 return s;}
function counter(y){return `<rect x="0" y="${y}" width="1080" height="${1920-y}" fill="url(#wood)"/><rect x="0" y="${y}" width="1080" height="22" fill="#6B4C33"/><rect x="0" y="${y+22}" width="1080" height="6" fill="#2A1E15"/>`;}
function floor(y){return `<rect x="0" y="${y}" width="1080" height="${1920-y}" fill="url(#floor)"/><rect x="0" y="${y}" width="1080" height="4" fill="#1E2A44"/>`;}

function karung(x,y,s=1,op=1,label=true){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><path d="M20 40 Q80 0 140 40 L156 190 Q80 225 4 190 Z" fill="#E6D3AE" stroke="#B08A4E" stroke-width="5"/><path d="M50 34 Q80 18 110 34" stroke="#8A5A2B" stroke-width="8" fill="none" stroke-linecap="round"/>${label?`<rect x="34" y="96" width="92" height="46" rx="8" fill="${NAVY}"/><text x="80" y="128" text-anchor="middle" font-family="Inter" font-weight="700" font-size="24" fill="${GOLD}">CUMI</text>`:''}</g>`;}
function karungFlat(x,y,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0 40 Q90 10 180 36 L176 60 Q90 76 4 62 Z" fill="#C9B48C" stroke="#8C6A3A" stroke-width="5"/></g>`;}

// ---------- characters ----------
function face(mood,cx,cy){const E=INK;let s='';
 const eye=(x)=>{
  if(mood==='sad') return `<path d="M${x-16} ${cy+4} q16 12 32 0" stroke="${E}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  if(mood==='happy') return `<path d="M${x-16} ${cy+6} q16 -18 32 0" stroke="${E}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  return `<circle cx="${x}" cy="${cy}" r="11" fill="${E}"/><circle cx="${x+4}" cy="${cy-4}" r="3.5" fill="#fff"/>`;};
 s+=eye(cx-38)+eye(cx+38);
 if(mood==='angry'){s+=`<path d="M${cx-62} ${cy-34} L${cx-18} ${cy-20} M${cx+62} ${cy-34} L${cx+18} ${cy-20}" stroke="${E}" stroke-width="8" stroke-linecap="round"/>`;}
 if(mood==='sad'){s+=`<path d="M${cx-60} ${cy-22} L${cx-20} ${cy-34} M${cx+60} ${cy-22} L${cx+20} ${cy-34}" stroke="${E}" stroke-width="7" stroke-linecap="round"/>`;}
 if(mood==='determined'){s+=`<path d="M${cx-60} ${cy-30} L${cx-18} ${cy-24} M${cx+60} ${cy-30} L${cx+18} ${cy-24}" stroke="${E}" stroke-width="8" stroke-linecap="round"/>`;}
 const my=cy+52;
 if(mood==='happy'||mood==='determined') s+=`<path d="M${cx-30} ${my-6} Q${cx} ${my+26} ${cx+30} ${my-6} Z" fill="#7A2E1D"/>`;
 else if(mood==='sad') s+=`<path d="M${cx-26} ${my+10} Q${cx} ${my-12} ${cx+26} ${my+10}" stroke="${E}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 else if(mood==='angry') s+=`<path d="M${cx-26} ${my+2} L${cx+26} ${my+2}" stroke="${E}" stroke-width="8" stroke-linecap="round"/>`;
 else s+=`<path d="M${cx-22} ${my} q22 14 44 0" stroke="${E}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 return s;}

function owner(x,y,s,mood,o={}){// local box ~ 340 x 560, origin top-left
 const sk='#E8B48A';let g=`<g transform="translate(${x},${y}) scale(${s})">`;
 g+=`<rect x="40" y="250" width="260" height="330" rx="110" fill="${BLUE}"/><path d="M110 262 L230 262 L250 580 L90 580 Z" fill="#E5E7EB"/><rect x="150" y="300" width="40" height="26" rx="6" fill="${GOLD}"/>`;
 if(o.phone){g+=`<path d="M270 330 Q340 260 300 190" stroke="${BLUE}" stroke-width="56" fill="none" stroke-linecap="round"/><rect x="262" y="120" width="70" height="120" rx="14" fill="#111827" stroke="#334155" stroke-width="4"/><rect x="270" y="132" width="54" height="92" rx="8" fill="#93C5FD" opacity="0.8"/><circle cx="300" cy="196" r="26" fill="${sk}" stroke="${INK}" stroke-width="5"/>`;}
 else if(o.point){g+=`<path d="M270 330 Q360 300 380 220" stroke="${BLUE}" stroke-width="56" fill="none" stroke-linecap="round"/><circle cx="384" cy="206" r="28" fill="${sk}" stroke="${INK}" stroke-width="5"/>`;}
 g+=`<rect x="146" y="214" width="48" height="50" fill="${sk}"/>`;
 g+=`<circle cx="170" cy="150" r="104" fill="${sk}" stroke="${INK}" stroke-width="7"/>`;
 g+=`<path d="M64 140 Q70 30 170 34 Q272 30 276 140 Q250 80 170 84 Q96 82 64 140 Z" fill="${INK}"/>`;
 g+=`<circle cx="66" cy="160" r="20" fill="${sk}" stroke="${INK}" stroke-width="6"/><circle cx="274" cy="160" r="20" fill="${sk}" stroke="${INK}" stroke-width="6"/>`;
 g+=face(mood,170,160);
 if(o.sweat) g+=`<path d="M268 92 q16 26 0 40 q-16 -14 0 -40z" fill="#93C5FD"/>`;
 if(o.steam){const k=o.steam;g+=`<g opacity="${0.6+0.4*Math.sin(k*9)}" stroke="#F87171" stroke-width="8" stroke-linecap="round" fill="none"><path d="M60 40 q-20 -30 0 -60"/><path d="M280 40 q20 -30 0 -60"/></g>`;}
 return g+'</g>';}

function person(x,y,s,c,mood=null,flip=false){let g=`<g transform="translate(${x},${y}) scale(${flip?-s:s},${s})">`;
 g+=`<rect x="-70" y="120" width="140" height="300" rx="70" fill="${c}"/><circle cx="0" cy="60" r="64" fill="${c}"/>`;
 if(mood){g+=`<circle cx="-22" cy="58" r="7" fill="#0B1220"/><circle cx="22" cy="58" r="7" fill="#0B1220"/>`;
  g+= mood==='happy'?`<path d="M-18 84 q18 16 36 0" stroke="#0B1220" stroke-width="6" fill="none" stroke-linecap="round"/>`:`<path d="M-16 90 h32" stroke="#0B1220" stroke-width="6" stroke-linecap="round"/>`;}
 return g+'</g>';}

function supplier(x,y,s,t){let g=`<g transform="translate(${x},${y}) scale(${s})">`;
 // chair
 g+=`<rect x="20" y="300" width="230" height="30" rx="10" fill="#475569"/><rect x="30" y="330" width="16" height="170" fill="#475569"/><rect x="226" y="330" width="16" height="170" fill="#475569"/><rect x="200" y="120" width="40" height="190" rx="14" fill="#475569"/>`;
 // crate
 g+=`<rect x="420" y="380" width="170" height="120" rx="10" fill="#7C5A3A" stroke="#4A3424" stroke-width="6"/><path d="M420 420 h170 M420 460 h170" stroke="#4A3424" stroke-width="5"/>`;
 // body & legs
 g+=`<rect x="60" y="170" width="150" height="160" rx="60" fill="#6B7280"/><path d="M190 300 L470 360" stroke="#334155" stroke-width="58" stroke-linecap="round"/><ellipse cx="500" cy="356" rx="40" ry="22" fill="#111827"/>`;
 // head
 const sk='#D9A27A';const bob=Math.sin(t*2)*4;
 g+=`<g transform="translate(0,${bob})"><circle cx="130" cy="110" r="78" fill="${sk}" stroke="${INK}" stroke-width="6"/>`;
 g+=`<path d="M52 96 Q60 20 130 22 Q200 20 210 96 Z" fill="#111827"/><path d="M190 80 L262 84 L262 100 L196 98 Z" fill="#111827"/>`;
 g+=`<path d="M98 112 q10 -8 20 0 M146 112 q10 -8 20 0" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M104 146 Q132 162 160 140" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/></g>`;
 // phone arm
 g+=`<path d="M190 230 Q270 200 262 140" stroke="#6B7280" stroke-width="44" fill="none" stroke-linecap="round"/><rect x="232" y="54" width="60" height="100" rx="12" fill="#111827" transform="rotate(12 262 104)"/><rect x="239" y="64" width="46" height="78" rx="6" fill="#93C5FD" opacity="0.85" transform="rotate(12 262 104)"/>`;
 return g+'</g>';}

function mascot(x,y,s,o={}){const t=o.t||0;const ex=o.expr||'smile';let g=`<g transform="translate(${x},${y}) scale(${s})">`;
 // cape
 const fl=Math.sin(t*6)*10;
 g+=`<path d="M40 130 Q100 112 160 130 L${200+fl} 330 Q100 300 ${0-fl} 330 Z" fill="${NAVY}" stroke="#14275E" stroke-width="5"/>`;
 // tentacles
 for(let i=0;i<4;i++){const bx=52+i*32;const w=Math.sin(t*5+i)*10;g+=`<path d="M${bx} 222 Q${bx+(i-1.5)*6+w} 268 ${bx+(i-1.5)*20} 300" stroke="${INK}" stroke-width="13" fill="none" stroke-linecap="round"/>`;}
 if(o.arm==='point'){g+=`<path d="M170 180 Q230 150 250 96" stroke="${INK}" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="252" cy="90" r="11" fill="${ORANGE}" stroke="${INK}" stroke-width="5"/>`;}
 if(o.arm==='up'){g+=`<path d="M170 170 Q220 120 214 50" stroke="${INK}" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="214" cy="44" r="13" fill="${ORANGE}" stroke="${INK}" stroke-width="5"/>`;}
 // mantle
 g+=`<path d="M100 8 L182 158 Q182 232 100 232 Q18 232 18 158 Z" fill="${ORANGE}" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>`;
 g+=`<path d="M100 30 L150 120" stroke="#F7C46A" stroke-width="10" stroke-linecap="round" opacity="0.7"/>`;
 g+=`<circle cx="100" cy="96" r="15" fill="${NAVY}"/>`;
 const py = ex==='roll'?-10:0, px = ex==='roll'?0:4;
 if(ex==='proud'){g+=`<path d="M58 160 q18 -18 36 0 M106 160 q18 -18 36 0" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/>`;}
 else {g+=`<circle cx="76" cy="160" r="24" fill="#fff" stroke="${INK}" stroke-width="6"/><circle cx="124" cy="160" r="24" fill="#fff" stroke="${INK}" stroke-width="6"/><circle cx="${76+px}" cy="${160+py}" r="10" fill="${INK}"/><circle cx="${124+px}" cy="${160+py}" r="10" fill="${INK}"/>`;
  if(ex==='roll') g+=`<path d="M52 140 h48 M100 140 h48" stroke="${INK}" stroke-width="6"/>`;}
 if(ex==='roll') g+=`<path d="M84 204 h32" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
 else g+=`<path d="M80 198 Q100 216 120 198" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 return g+'</g>';}

function clock(x,y,t){const a=t*6;return `<g transform="translate(${x},${y})"><circle r="70" fill="#E5E7EB" stroke="${NAVY}" stroke-width="10"/><line x1="0" y1="0" x2="0" y2="-44" stroke="${INK}" stroke-width="8" stroke-linecap="round" transform="rotate(${a*30})"/><line x1="0" y1="0" x2="30" y2="0" stroke="${INK}" stroke-width="8" stroke-linecap="round"/><circle r="7" fill="${INK}"/></g>`;}

function waves(y,t,amp,c,op,ph=0){let d=`M0 ${y}`;for(let x=0;x<=1080;x+=30){d+=` L${x} ${y+Math.sin(x/90+t*2.2+ph)*amp}`;}d+=` L1080 1920 L0 1920 Z`;return `<path d="${d}" fill="${c}" opacity="${op}"/>`;}
function boat(x,y,s,t,ph){const r=Math.sin(t*2+ph)*6;return `<g transform="translate(${x},${y+Math.sin(t*2.2+ph)*10}) rotate(${r}) scale(${s})"><path d="M-130 0 L130 0 L96 60 L-96 60 Z" fill="#1E3A8A" stroke="#93C5FD" stroke-width="4"/><rect x="-6" y="-170" width="12" height="170" fill="#475569"/><path d="M6 -160 L90 -20 L6 -20 Z" fill="#334155"/></g>`;}

// ---------- captions ----------
const CAPS={
 N1:{c:["Tanya stok ke supplier,","jawabannya selalu *kreatif…*"]},
 N2:{c:["Mau marah, *nggak enak.*","Mau nunggu, pelangganmu nggak bisa *ditahan.*"]},
 N3:{c:["Yang konsisten… cuma *alasannya.*"],big:true},
 N4:{c:["Biar nggak digantung terus,","lakukan *ini.*"]},
 N7:{c:["Masalahnya, kalau bahannya *hasil laut*,","pas musim angin…","semua supplier *kompak* alasannya."]},
 M1:{c:["Di *Cumiasin*,","produsen cumi asin langsung dari Jakarta,","stok kami jaga *tetap ada!*"]},
 M2:{c:["Jualan jalan terus,","tanpa drama *lagi kosong.*"]},
 M3:{c:["Komen *PRICELIST*,","kami kirim lewat DM."]},
};
function tokens(str){const out=[];let hl=false;for(const w of str.split(' ')){let x=w,start=false,end=false;if(x.startsWith('*')){hl=true;x=x.slice(1);start=true;}if(x.endsWith('*')||x.endsWith('*,')){end=true;x=x.replace('*','');}
 out.push({w:x,hl});if(end)hl=false;}return out;}
function captionHTML(t){for(const id in CAPS){const s=TL[id];if(!s)continue;if(t<s.t-0.1||t>s.e+0.35)continue;
  const ch=CAPS[id].c;const tot=ch.reduce((a,c)=>a+c.length,0);let acc=s.t;let cur=null,cs=0,ce=0;
  for(const c of ch){const d=(s.e-s.t)*c.length/tot;if(t>=acc-0.1){cur=c;cs=acc;ce=acc+d;}acc+=d;}
  if(!cur)return '';const tk=tokens(cur);const n=tk.length;
  const pop=eo(lin(t,cs-0.1,cs+0.15));
  let h='';tk.forEach((k,i)=>{const at=cs+(i/n)*(ce-cs)*0.8;const vis=t>=at-0.02?1:0.32;
   h+=`<span class="w ${k.hl?'hl':''}" style="opacity:${vis}">${k.w}</span>`+(i<n-1?(k.hl&&tk[i+1].hl?'<span class="hl" style="opacity:'+(t>=cs+((i+1)/n)*(ce-cs)*0.8-0.02?1:0.32)+'"> </span>':' '):'');});
  const big=CAPS[id].big;
  return `<div class="glass cap" style="top:${big?1010:1040}px;font-size:${big?72:64}px;transform:translateY(${(1-pop)*30}px);opacity:${pop}">${h}</div>`;}
 return '';}

// ---------- scenes ----------
const T=k=>TL[k];
function scene(t){let a=DEFS,u='';const sh=(t>=39.7&&t<40.1)?Math.sin(t*90)*14*(1-lin(t,39.7,40.1)):0;
 // S1 hook 0 - 4.5 ; S3 jadinya ; S8 manfaat share warung
 const sc1=t<4.5, sc2=t>=4.5&&t<11.5, sc3=t>=11.5&&t<17.1, sc4=t>=17.1&&t<21.2, sc5=t>=21.2&&t<31.6, sc6=t>=31.6&&t<39.4, sc7=t>=39.4&&t<45.55, sc8=t>=45.55&&t<49.15, sc9=t>=49.15;
 if(sc1||sc3||sc8){
  a+=bg(t)+lights(250,1)+shelf(80,560,920,false)+awning(390);
  const mood=sc1?'neutral':(sc3?'angry':'happy');
  a+=owner(230,520,1.0,mood,{phone:sc1||sc3,steam:sc3?t:0,sweat:sc3});
  a+=counter(1010);
  a+=karung(60,880,0.95)+karung(840,880,0.95);
  if(sc1){const pk=eo(lin(t,1.6,2.4));a+=mascot(150,1010-170*pk,0.62,{t,expr:'smile'})+karung(60,880,0.95);}
  // queue (front)
  const cols=['#475569','#3F4C63','#52607A','#5B6B88'];
  for(let i=0;i<4;i++){const px=620+i*120, py=1140+(i%2)*30;let mood2=sc8?'happy':(sc3?'flat':null);
   const tap=sc3?Math.abs(Math.sin(t*8+i))*10:0;a+=person(px,py-tap,0.95,cols[i],mood2);}
  if(sc3){a+=clock(170,300+40,t);}
  if(sc8){a+=mascot(420,880,0.75,{t,expr:'smile',arm:'up'});}
  if(sc1){const p1=eb(lin(t,0.3,0.7));u+=`<div class="glass light" style="left:520px;top:470px;padding:22px 36px;font-size:52px;font-weight:500;border-radius:40px 40px 10px 40px;transform:scale(${p1});transform-origin:0 100%">Stok ada, Ka?</div>`;
   if(t>1.2){const dots=[0,1,2].map(i=>`<span style="opacity:${0.35+0.65*(Math.floor(t*3+i)%3===0?1:0)}">●</span>`).join(' ');
    u+=`<div class="glass" style="left:560px;top:620px;padding:16px 34px;font-size:34px;color:#E5E7EB;opacity:${eo(lin(t,1.2,1.5))}">${dots}</div>`;}
   u+=`<div class="glass pill" style="opacity:${eo(lin(t,0,0.4))}">Alasan supplier</div>`;}
 }
 if(sc2){a+=bg(t,glow(860,760,380,'gG',0.25))+shelf(640,640,360,true);
  a+=`<text x="820" y="760" text-anchor="middle" font-family="Inter" font-weight="600" font-size="40" fill="#94A3B8">kosong</text>`;
  a+=floor(1180)+karungFlat(60,1300,1.3)+karungFlat(700,1360,1.2)+karungFlat(380,1500,1.4);
  a+=supplier(90,760,1.05,t);
  const lines=[['S1','Lagi kosong, Ka.'],['S2','Besok ya, Kaaa…'],['S3','Minggu depan pasti ada, Ka!']];
  let cur=null,st=0;for(const [k,txt] of lines){if(t>=T(k).t-0.15){cur=txt;st=T(k).t-0.15;}}
  if(cur){const p=eb(lin(t,st,st+0.35));u+=`<div class="glass light" style="left:90px;top:400px;max-width:820px;padding:30px 44px;font-size:60px;font-weight:600;border-radius:44px 44px 44px 12px;transform:scale(${p});transform-origin:0 100%">${cur}</div>`;}
  u+=`<div class="glass pill">Alasan supplier</div>`;
  if(t>9.9){const p=eb(lin(t,9.9,10.3));a+=mascot(720,980+ (1-p)*200,0.6,{t,expr:'roll'});u+=`<div class="glass light" style="left:770px;top:930px;padding:12px 26px;font-size:40px;font-weight:600;opacity:${p}">Hadeh</div>`;}
 }
